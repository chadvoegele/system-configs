#!/usr/bin/nft -f

define internal_nic = enp1s0f1
define fiber_wan_nic = enp1s0f0
define cable_wan_nic = eno1
define wan_nics = { enp1s0f0, eno1 }
define vpn_nic = wg0

define vpn_port = 51871

destroy table inet filter
table inet filter {
  chain prerouting_policy {
    type filter hook prerouting priority mangle

    iifname $fiber_wan_nic ct mark 0 ct mark set 1
    iifname $cable_wan_nic ct mark 0 ct mark set 2

    iifname { $internal_nic, $vpn_nic } ct state new ct mark 0 ct mark set numgen random mod 2 map { 0 : 1, 1 : 2 }
    # Policy routing uses meta mark; nftables persists WAN selection in ct mark.
    ct mark != 0 meta mark set ct mark
  }

  chain output_policy {
    type route hook output priority mangle

    ct state new ct mark 0 ct mark set numgen random mod 2 map { 0 : 1, 1 : 2 }
    ct mark != 0 meta mark set ct mark
  }

  chain input {
    type filter hook input priority 0

    ip protocol icmp icmp type echo-request meter router-icmp { ip saddr limit rate 1/second } accept
    ip protocol icmp icmp type { echo-reply, destination-unreachable, time-exceeded, parameter-problem } accept
    ip protocol icmp reject with icmp type port-unreachable

    ct state { established, related } accept
    ct state invalid drop

    iif lo accept

    iifname { $internal_nic, $vpn_nic } tcp dport ssh ct state new accept comment "ssh"
    iifname { $internal_nic, $vpn_nic } meta l4proto { tcp, udp } th dport domain ct state new accept comment "dns"
    iifname $wan_nics udp dport $vpn_port ct state new accept comment "vpn"

    drop
  }

  chain forward {
    type filter hook forward priority 0

    oifname $wan_nics tcp flags syn tcp option maxseg size set rt mtu

    ct state { established, related } accept
    ct state invalid drop

    iif { lo, $internal_nic } accept
    iifname $vpn_nic accept

    drop
  }

  chain output {
    type filter hook output priority 0
  }
}

destroy table ip nat
table ip nat {
  chain postrouting {
    type nat hook postrouting priority 100
    oifname $wan_nics ip saddr 10.0.0.0/16 masquerade
    oifname $wan_nics ip saddr 192.168.0.0/24 masquerade
  }
}
