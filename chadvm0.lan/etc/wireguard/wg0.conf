[Interface]
Address = 192.168.0.254/32
ListenPort = 51871
PostUp = wg set %i private-key /etc/wireguard/%i.private.key

# chadrouter
[Peer]
PublicKey = PUBLIC_KEY_chadrouter.lan
AllowedIPs = 192.168.0.1/32, 10.0.0.0/16

# chadphone
[Peer]
PublicKey = PUBLIC_KEY_chadphone.lan
AllowedIPs = 192.168.0.100/32

# chadlaptop
[Peer]
PublicKey = PUBLIC_KEY_chadlaptop.lan
AllowedIPs = 192.168.0.102/32
